services:
  - type: web
    name: smartwork
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: capstone
      - key: DB_PORT
        value: 4000
      - key: DB_SSL
        value: "true"
      - key: MONGODB_URL
        sync: false
      - key: _ENCRYPTION_ALGORITHM
        sync: false
      - key: _ENCRYPTION_IV
        sync: false
      - key: _ENCRYPTION_KEY
        sync: false
